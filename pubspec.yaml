name: ssb_tour
description: SSB Tour — a full-stack tour package booking app built with Flutter.
publish_to: 'none'
version: 2.0.0+2

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_rating_bar: ^4.0.1
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.3
  http: ^1.6.0
  intl: ^0.20.3
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
